name: bootstrap
# Run once (Actions → bootstrap → Run workflow) after the secrets are set and the domains are on Cloudflare.
on:
  workflow_dispatch: {}
  push: { branches: [main], paths: ["ops/bootstrap.txt"] } # commit to this file to trigger from a session
permissions: { contents: write }
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DW_GH_TOKEN: ${{ secrets.DW_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: scripts/ci-setup.sh
      - name: Check the lab passphrase
        run: |
          if [ -z "${{ secrets.DW_LAB_KEY }}" ]; then echo "::error::Set the DW_LAB_KEY secret (any long passphrase you choose) first."; exit 1; fi
      - name: Bootstrap generation 0
        env:
          DW_LAB_KEY: ${{ secrets.DW_LAB_KEY }}
        run: node scripts/bootstrap.mjs
