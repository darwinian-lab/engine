name: hotfix
# Ships a species' main as its current champion right away (same gates as a mutant: tests, typecheck, build, e2e;
# additive migrations only). For owner/engine changes committed straight to main. Commit ops/hotfix.txt with the
# species ids (one per line, or "all") to trigger it from a session.
on:
  push: { branches: [main], paths: ["ops/hotfix.txt"] }
  workflow_dispatch:
    inputs:
      species: { description: "Only this species (qr, resume, wall); empty = the ones in ops/hotfix.txt", required: false }
concurrency: { group: hotfix, cancel-in-progress: false }
jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DW_GH_TOKEN: ${{ secrets.DW_GH_TOKEN }}
      DW_LAB_KEY: ${{ secrets.DW_LAB_KEY }}
      GH_TOKEN: ${{ secrets.DW_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: scripts/ci-setup.sh
      - name: Redeploy champions from main
        run: |
          LIST="${{ inputs.species }}"
          [ -z "$LIST" ] && LIST=$(grep -v '^#' ops/hotfix.txt | tr -s ' \n' ' ')
          if echo "$LIST" | grep -qw all; then node evolve/run.mjs --redeploy-champion; exit 0; fi
          for s in $LIST; do node evolve/run.mjs --redeploy-champion --species "$s"; done
