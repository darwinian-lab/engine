# One router per species, all built from the same code.
# DB id and domains are filled in by scripts/bootstrap.mjs (it rewrites the __PLACEHOLDERS__).
name = "dw-router"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false

[triggers]
crons = ["*/15 * * * *"]

[env.qr]
name = "dw-router-qr"
vars = { SPECIES = "qr", EVOLVE_EVERY_H = "2" }
routes = [{ pattern = "qrsthatlast.com", custom_domain = true }]
d1_databases = [{ binding = "DB", database_name = "darwinian", database_id = "7af0faf8-b931-4de5-8d33-0dd72170b28e" }]

[env.resume]
name = "dw-router-resume"
vars = { SPECIES = "resume" }
routes = [{ pattern = "calmcv.com", custom_domain = true }]
d1_databases = [{ binding = "DB", database_name = "darwinian", database_id = "7af0faf8-b931-4de5-8d33-0dd72170b28e" }]

[env.wall]
name = "dw-router-wall"
vars = { SPECIES = "wall" }
routes = [{ pattern = "kudospage.com", custom_domain = true }]
d1_databases = [{ binding = "DB", database_name = "darwinian", database_id = "7af0faf8-b931-4de5-8d33-0dd72170b28e" }]
